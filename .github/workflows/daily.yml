name: Daily Morning Report

on:
  schedule:
    # 目标: 北京时间 10:00 (UTC 02:00)
    # GitHub 免费版 schedule 常被延迟数小时, 因此设多个时间点 + 幂等判断,
    # 当天只要有一次真正触发就生成, 其余运行直接跳过。
    - cron: "30 1 * * *"
    - cron: "0 2 * * *"
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch: # 支持手动触发(调试用)
  push:
    branches: [main]
    # 报告提交只改 docs/, 忽略它可避免自触发死循环
    paths-ignore:
      - "docs/**"

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check today's report
        id: guard
        run: |
          today=$(TZ=Asia/Shanghai date +%F)
          if [ -f "docs/archive/${today}.html" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天的早报已存在 (${today}), 跳过本次运行"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "尚未生成 ${today} 的早报, 继续执行"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Generate report
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python main.py

      - name: Commit and push report
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "无变化, 跳过提交"
          else
            git commit -m "report: ${GITHUB_RUN_ID} $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi
